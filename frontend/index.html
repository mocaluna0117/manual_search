<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= はブラウザの頑固なfaviconキャッシュを破るためのバージョン番号 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>社内マニュアル検索</title>
    <script>
      // 配色を<html>のクラスに反映する。Reactの描画より先に実行するので、
      // 起動時に明るい画面が一瞬見える現象が起きない。
      // Chakraは .dark クラスを見て配色を切り替える(_dark条件)。
      // 設定(端末準拠/ライト固定/ダーク固定)はlocalStorageから読む。
      // 設定変更の反映と端末側の変更監視はReact側(lib/settings.ts)が行う
      ;(function () {
        var mode = 'system'
        try {
          var saved = localStorage.getItem('manualSearch.settings.theme')
          if (saved === 'light' || saved === 'dark') mode = saved
        } catch (e) {
          // ストレージが使えない環境は端末準拠のまま
        }
        var isDark =
          mode === 'dark' ||
          (mode === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.classList.toggle('dark', isDark)
        root.classList.toggle('light', !isDark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
